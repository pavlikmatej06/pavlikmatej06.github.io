<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Restaurace Zeland – Projekt</title>
    <style>
        
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #E8F5E9; 
            color: #2E7D32; 
            text-align: center;
        }

        header {
            background-color: #2E7D32;
            color: white;
            padding: 20px;
            font-size: 28px;
            font-weight: bold;
        }

        
        a.button {
            display: inline-block;
            margin: 20px 0;
            padding: 12px 25px;
            background-color: #2E7D32;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        a.button:hover {
            background-color: #1B5E20;
        }
      
        iframe {
            border: 3px solid #2E7D32;
            border-radius: 10px;
            width: 90%;
            height: 600px;
            margin-bottom: 30px;
        }

        
        footer {
            margin-top: 20px;
            font-size: 14px;
            color: gray;
        }
    </style>
</head>
<body>

<header>
    Restaurace Zeland – Projekt
</header>


<a class="button" href="https://www.restauracezeland.cz" target="_blank">
    Navštivte oficiální stránku restaurace
</a>


<iframe src="Zeland.pdf"></iframe>

<footer>
    Projekt vytvořen z PDF dokumentu z Overleaf
</footer>
